version: '3.8'

services:
  file-converter:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - MAX_UPLOAD_SIZE=209715200
      - FILE_EXPIRATION_MINUTES=60
    volumes:
      - tmp_storage:/tmp/file-converter-storage

volumes:
  tmp_storage:
